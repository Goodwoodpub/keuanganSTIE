<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sistem Manajemen Dana Operasional STIE Krakatau</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sistem Manajemen Dana Operasional STIE Krakatau — request dana, persetujuan, realisasi, dan LPJ.">
<meta name="theme-color" content="#16213e">
<link rel="icon" type="image/webp" href="/img/logo.webp">
<link rel="apple-touch-icon" href="/img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
#boot{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--mu);gap:12px;font-size:15px}
#boot i{width:22px;height:22px;border:3px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:bt .8s linear infinite}
@keyframes bt{to{transform:rotate(360deg)}}
#netbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#16213e;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none}
#netbar.on{display:block}#netbar.bad{background:#9b2c2c}
</style>
</head>
<body>
<div id="app"><div id="boot"><i></i>Memuat sistem…</div></div><div id="pv"></div><div id="lb"></div><div id="netbar" role="status"></div>
<noscript><p style="padding:24px">Aktifkan JavaScript untuk menggunakan sistem ini.</p></noscript>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
